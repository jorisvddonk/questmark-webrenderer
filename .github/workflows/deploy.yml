name: Deploy demo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the renderer
        run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p site-out/demos
          cp -r dist site-out/dist
          cp site/index.html site-out/index.html
          # Serve the example documents from the built renderer in this deploy
          # instead of the published package on unpkg.
          for f in examples/*.md.html; do
            sed 's#https://unpkg.com/questmark-webrenderer@[0-9.]*/dist/#../dist/#g' "$f" > "site-out/demos/$(basename "$f")"
          done
          ls -R site-out

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5